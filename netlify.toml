# Netlify configuration for the Char Kuey Teow Abang Chor menu site.
#
# The site is plain HTML/CSS/JS with no build step, so Netlify only needs to
# know which folder to publish. If you connect this repo in the Netlify UI,
# leave "Build command" empty and it will pick these settings up from here.

[build]
  publish = "restaurant-site"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Hashed-free static assets change with each deploy, so keep the cache short
# enough that menu edits go live immediately.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
